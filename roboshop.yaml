- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    instances: ["monodb","redis","mysql","rabbitmq"]
    action: create
    domain_name: teja97s.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instance
  Amazon.aws.ec2_instances:
     name: "roboshop-{{ item }}"
     image_id: "{{ami_id }}"
     instance_type: t3.micro
     security_groups:
     - roboshop-common
     - "roboshop-{{ item }}"
     region: us-east-1
  loop: "{{ instances }}"
  when: action == "create"
